<!DOCTYPE html>
<head lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0000ff;
            margin: 0;
        }

        .calculator {
            background-color: #222;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
            width: 460px;
        }

        .display {
            background-color: #444;
            color: white;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            overflow-x: auto;
            /* Added a minimum height so the box doesn't collapse when empty */
            min-height: 38px; 
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            background-color: #eee;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover { background-color: #ccc; }

        .operator {
            background-color: #ff9900;
            color: white;
        }

        .operator:hover { background-color: #ffff0021; }
        .zero { grid-column: span 2; }

        .equal {
            grid-column: 4;
            grid-row: 3 / 5; 
            background-color: #ff9900;
        }
        .equal:hover { background-color: #2188370e; }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display" id="display"></div>

    <div class="buttons">
        
        <button onclick="document.getElementById('display').innerText = ''" class="operator">C</button>
        
        <button onclick="document.getElementById('display').innerText += '/'" class="operator">/</button>
        <button onclick="document.getElementById('display').innerText += '*'" class="operator">*</button>
        <button onclick="document.getElementById('display').innerText += '-'" class="operator">-</button>
        
        <button onclick="document.getElementById('display').innerText += '7'">7</button>
        <button onclick="document.getElementById('display').innerText += '8'">8</button>
        <button onclick="document.getElementById('display').innerText += '9'">9</button>
        
        <button onclick="document.getElementById('display').innerText += '+'" class="operator">+</button>
        
        <button onclick="document.getElementById('display').innerText += '4'">4</button>
        <button onclick="document.getElementById('display').innerText += '5'">5</button>
        <button onclick="document.getElementById('display').innerText += '6'">6</button>
        
        <button onclick="try { document.getElementById('display').innerText = eval(document.getElementById('display').innerText); } catch(error) { document.getElementById('display').innerText = 'Error'; }" class="operator equal" rowspan="2">=</button>
        
        <button onclick="document.getElementById('display').innerText += '1'">1</button>
        <button onclick="document.getElementById('display').innerText += '2'">2</button>
        <button onclick="document.getElementById('display').innerText += '3'">3</button>
        
        <button onclick="document.getElementById('display').innerText += '0'" class="zero">0</button>
        <button onclick="document.getElementById('display').innerText += '.'">.</button>
    </div>
</div>

</body>
</html>
